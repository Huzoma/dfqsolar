<svg viewBox="0 0 600 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand logo: DFQ Solar World -->
  <g id="logo-graphics">
    <!-- Letters D and F -->
    <path d="M40 50 H120 C150 50 170 70 170 95 C170 120 150 140 120 140 H80 V175 H40 V50 Z M80 85 V105 H120 C130 105 135 100 135 95 C135 90 130 85 120 85 H80 Z" fill="url(#primary-blue-grad)" />
    <path d="M185 50 H275 V85 H220 V110 H265 V140 H220 V175 H185 V50 Z" fill="url(#primary-blue-grad)" />

    <!-- Letter Q with Sun and Globe -->
    <!-- Q Circle Outer -->
    <circle cx="345" cy="112" r="62" stroke="url(#primary-blue-grad)" stroke-width="12" fill="#FFFFFF" />
    
    <!-- Sun Rays on Top-Right -->
    <path d="M390 62 L410 42" stroke="#FDB813" stroke-width="4" stroke-linecap="round" />
    <path d="M402 76 L428 66" stroke="#FDB813" stroke-width="4" stroke-linecap="round" />
    <path d="M410 92 L440 92" stroke="#FDB813" stroke-width="4" stroke-linecap="round" />
    <path d="M402 108 L428 118" stroke="#FDB813" stroke-width="4" stroke-linecap="round" />
    <path d="M390 122 L410 142" stroke="#FDB813" stroke-width="4" stroke-linecap="round" />
    <path d="M374 53 L384 27" stroke="#FDB813" stroke-width="4" stroke-linecap="round" />
    <path d="M356 50 L356 20" stroke="#FDB813" stroke-width="4" stroke-linecap="round" />
    
    <!-- Sun Outline/Backing -->
    <path d="M335 52 C355 52 385 70 395 92" stroke="#F7941D" stroke-width="6" fill="none" stroke-linecap="round" />
    
    <!-- Globe Landmasses in Upper Q -->
    <path d="M310 92 C312 80 320 70 332 65 C336 67 340 72 344 72 C350 72 355 64 362 68 C368 72 370 78 376 80 C382 82 388 88 388 92" fill="#1E5DB5" opacity="0.35" />
    <path d="M312 92 C320 92 330 84 338 88 C344 92 350 95 358 92 C362 90 366 84 372 84 C380 84 384 90 388 92" stroke="#1E5DB5" stroke-width="1" fill="none" opacity="0.3" />
    
    <!-- Solar Panels Grid in Lower Q -->
    <g id="solar-panel-grid" clip-path="url(#lower-q-clip)">
      <!-- Background of panels -->
      <path d="M280 112 H410 V175 H280 Z" fill="#0B3D91" />
      <path d="M280 112 H410" stroke="#FFFFFF" stroke-width="2" />
      <path d="M280 126 H410" stroke="#FFFFFF" stroke-width="2" />
      <path d="M280 140 H410" stroke="#FFFFFF" stroke-width="2" />
      <path d="M280 154 H410" stroke="#FFFFFF" stroke-width="2" />
      
      <!-- Panel Columns -->
      <path d="M345 112 L315 174" stroke="#FFFFFF" stroke-width="2" />
      <path d="M345 112 L330 174" stroke="#FFFFFF" stroke-width="2" />
      <path d="M345 112 L345 174" stroke="#FFFFFF" stroke-width="2" />
      <path d="M345 112 L360 174" stroke="#FFFFFF" stroke-width="2" />
      <path d="M345 112 L375 174" stroke="#FFFFFF" stroke-width="2" />
      <path d="M345 112 L300 174" stroke="#FFFFFF" stroke-width="2" />
      <path d="M345 112 L390 174" stroke="#FFFFFF" stroke-width="2" />
    </g>

    <!-- Q Tail Swoosh -->
    <path d="M380 150 C410 160 430 165 450 155 C430 145 400 140 375 145 Z" fill="#0B3D91" />
    <path d="M375 145 C410 140 435 150 455 160 C425 170 395 162 370 146 Z" fill="#1E5DB5" opacity="0.8" />
  </g>

  <!-- Subtitle Text -->
  <g id="logo-text">
    <line x1="40" y1="210" x2="160" y2="210" stroke="#F7941D" stroke-width="4" stroke-linecap="round" />
    <text x="175" y="218" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="24" fill="#F7941D" letter-spacing="6">SOLAR</text>
    <text x="312" y="218" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="24" fill="#0B3D91" letter-spacing="6">WORLD</text>
    <line x1="450" y1="210" x2="570" y2="210" stroke="#0B3D91" stroke-width="4" stroke-linecap="round" />
  </g>

  <defs>
    <!-- Clip path to keep solar grid inside lower circle of Q -->
    <clipPath id="lower-q-clip">
      <path d="M288 112 C288 143 313 168 345 168 C377 168 402 143 402 112 H288 Z" />
    </clipPath>
    
    <!-- Gradient definition -->
    <linearGradient id="primary-blue-grad" x1="40" y1="50" x2="345" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B3D91" />
      <stop offset="100%" stop-color="#071C3D" />
    </linearGradient>
  </defs>
</svg>
